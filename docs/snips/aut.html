<div id="adiv">
  <div id="art-body" class="scp-section">
    <div id="hdr">
      <div class="button-container">
        <input id="choose-artifact" class="lbn" type="button" value="Choose" />
        <input id="clear-artifact" class="lbn" type="button" value="Clear" />
      </div>
    </div>
    <div id="trk">
      <fieldset>
        <legend>Tracking</legend>
        <div class="artifact-section">
          <div id="authno"></div>
          <div>
            <div id="requested-date-of-service"></div>
            <div id="received-date"></div>
            <div id="date-range"></div>
            <div id="udf-retro-dos"></div>
          </div>
          <div>
            <div id="place-of-service"></div>
            <div id="authorization-class"></div>
            <div id="authorization-status"></div>
            <div id="authorization-priority"></div>
          </div>
        </div>
      </fieldset>
    </div>
    <div id="inp">
      <fieldset>
        <legend>Inpatient Detail</legend>
        <div id="inp-div"></div>
      </fieldset>
    </div>
    <div id="mbr">
      <fieldset>
        <legend>Member</legend>
        <div class="artifact-sub-section">
          <div id="membid"></div>
        </div>
        <div class="artifact-sub-section">
          <div id="member-full-name"></div>
          <div id="member-dob"></div>
          <div id="member-sex"></div>
        </div>
      </fieldset>
    </div>
    <div id="eli">
      <fieldset>
        <legend>Health Plan</legend>
        <div class="artifact-sub-section">
          <div id="hpcode"></div>
          <div id="opt"></div>
          <div id="hp-eff-date"></div>
          <div id="hp-thru-date"></div>
        </div>
      </fieldset>
    </div>
    <div id="pcp">
      <fieldset>
        <legend>PCP</legend>
        <div class="artifact-sub-section">
          <div id="pcp-full-name"></div>
          <div id="pcp-npi"></div>
          <div id="pcp-eff-date"></div>
          <div id="pcp-thru-date"></div>
        </div>
      </fieldset>
    </div>
    <div id="req">
      <fieldset>
        <legend>Requested By</legend>
        <div class="artifact-sub-section">
          <div id="req-by-provider-code"></div>
        </div>
        <div class="artifact-sub-section">
          <div id="req-by-provider-name"></div>
          <div id="req-by-provider-address"></div>
          <div id="req-by-provider-phone"></div>
          <div id="req-by-provider-fax"></div>
          <div id="req-by-speccode"></div>
          <div id="req-by-npino"></div>
        </div>
      </fieldset>
    </div>
    <div id="ref">
      <fieldset>
        <legend>Referred To</legend>
        <div class="artifact-sub-section">
          <div id="ref-to-provider-code"></div>
        </div>
        <div class="artifact-sub-section">
          <div id="ref-to-provider-name"></div>
          <div id="ref-to-provider-address"></div>
          <div id="ref-to-provider-phone"></div>
          <div id="ref-to-provider-fax"></div>
          <div id="ref-to-speccode"></div>
          <div id="ref-to-npino"></div>
        </div>
      </fieldset>
    </div>
    <div id="fac">
      <fieldset>
        <legend>Facility</legend>
        <div class="artifact-sub-section">
          <div id="fac-provider-code"></div>
        </div>
        <div class="artifact-sub-section">
          <div id="fac-provider-name"></div>
          <div id="fac-provider-address"></div>
          <div id="fac-provider-phone"></div>
          <div id="fac-provider-fax"></div>
          <div id="fac-provider-speccode"></div>
          <div id="fac-npino"></div>
        </div>
      </fieldset>
    </div>
    <div id="dia">
      <fieldset>
        <legend>Diagnoses</legend>
        <div id="dia-div"></div>
      </fieldset>
    </div>
    <div id="prc">
      <fieldset>
        <legend>Procedures</legend>
        <div id="prc-div"></div>
      </fieldset>
    </div>
    <div id="nte">
      <fieldset>
        <legend>Notes</legend>
        <div id="nte-div"></div>
      </fieldset>
    </div>
    <div id="xrf">
      <fieldset>
        <legend>References</legend>
        <div id="xrf-div"></div>
      </fieldset>
    </div>
    <div id="oth">
      <fieldset>
        <legend>Referenced in Notes</legend>
        <div id="oth-div"></div>
      </fieldset>
    </div>
    <div id="inc">
      <fieldset>
        <legend>Incidents</legend>
        <div id="inc-div"></div>
      </fieldset>
    </div>
  </div>
</div>
