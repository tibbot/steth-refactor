<div id="adiv" style="display: block">
    <div id="art" class="scp-section">
        <div id="hdr">
            <div class="button-container">
                <div id="detl-actions"></div>
            </div>
        </div>
        <div id="trk">
            <fieldset>
                <legend>Tracking</legend>
                <div class="artifact-section">
                    <div>
                        <div id="claimno" data-bind="CLAIMNO" data-label="Claim ID"></div>
                        <div id="authno" data-bind="AUTHNO" data-label="Authorization ID"></div>
                    </div>
                    <div>
                        <div id="phcode" data-bind="PHCODE" data-label="P/H"></div>
                        <div id="placesvc" data-bind="PLACESVC" data-label="Place of Service"></div>
                    </div>
                    <div>
                        <div id="daterecd" data-bind="DATERECD" data-label="Date Received"></div>
                        <div id="datefrom" data-bind="DATEFROM" data-label="Service From"></div>
                        <div id="dateto" data-bind="DATETO" data-label="Service Thru"></div>
                    </div>
                </div>
            </fieldset>
        </div>
        <div id="bil">
            <fieldset>
                <legend>Billing</legend>
                <div class="artifact-section">
                    <div>
                        <div id="provclaim" data-bind="PROVCLAIM" data-label="Provider Claim #"></div>
                        <div id="datepaid" data-bind="DATEPAID" data-label="Date Paid"></div>
                        <div id="billed" data-bind="BILLED" data-label="Billed"></div>
                    </div>
                    <div>
                        <div id="amountpaid" data-bind="AMOUNTPAID" data-label="Paid"></div>
                        <div id="coinsurance" data-bind="COINSURANCE" data-label="Coinsurance"></div>
                        <div id="copay" data-bind="COPAY" data-label="Copay"></div>
                        <div id="deductible" data-bind="DEDUCTIBLE" data-label="Deductible"></div>
                    </div>
                    <div>
                        <div id="status" data-bind="STATUS" data-label="Status"></div>
                        <div id="checkno" data-bind="CHECKNO" data-label="Check #"></div>
                        <div id="payment-bulk-amount" data-bind="payment_bulk_amount" data-label="Check Amount"></div>
                    </div>
                </div>
            </fieldset>
        </div>
        <div id="mbr">
            <fieldset>
                <legend>Member</legend>
                <div class="artifact-sub-section">
                    <div id="membid" data-bind="MEMBID" data-label="Member #"></div>
                </div>
                <div class="artifact-sub-section">
                    <div id="member-full-name" data-bind="member_full_name" data-label="Name"></div>
                    <div id="member-dob" data-bind="member_dob" data-label="Date of Birth"></div>
                    <div id="member-sex" data-bind="member_sex" data-label="Sex"></div>
                </div>
            </fieldset>
        </div>
        <div id="eli">
            <fieldset>
                <legend>Health Plan</legend>
                <div class="artifact-sub-section">
                    <div id="hpcode" data-bind="HPCODE" data-label="Carrier"></div>
                    <div id="opt" data-bind="OPT" data-label="Plan"></div>
                    <div id="hp-eff-date" data-bind="hp_eff_date" data-label="Effective"></div>
                    <div id="hp-thru-date" data-bind="hp_thru_date" data-label="Terminated"></div>
                </div>
            </fieldset>
        </div>
        <div id="pcp">
            <fieldset>
                <legend>PCP</legend>
                <div class="artifact-sub-section">
                    <div id="pcp-full-name" data-bind="pcp_full_name" data-label="Name"></div>
                    <div id="pcp-npi" data-bind="pcp_npi" data-label="NPI"></div>
                    <div id="pcp-eff-date" data-bind="pcp_eff_date" data-label="Effective"></div>
                    <div id="pcp-thru-date" data-bind="pcp_thru_date" data-label="Terminated"></div>
                </div>
            </fieldset>
        </div>
        <div id="dia">
            <fieldset>
                <legend>Diagnoses</legend>
                <div id="dia-div"></div>
            </fieldset>
        </div>
        <div id="prc">
            <fieldset>
                <legend>Procedures</legend>
                <div id="prc-div"></div>
            </fieldset>
        </div>
        <div id="rnd">
            <fieldset>
                <legend>Rendering Provider</legend>
                <div class="artifact-sub-section">
                    <div id="rnd-provider-name" data-bind="rnd_provider_name" data-label="Name"></div>
                    <div id="rnd-provider-code" data-bind="rnd_provider_code" data-label="Provider ID"></div>
                    <div id="rnd-provider-address" data-bind="rnd_provider_address" data-label="Address"></div>
                    <div id="rnd-provider-phone" data-bind="rnd_provider_phone" data-label="Phone"></div>
                    <div id="rnd-provider-fax" data-bind="rnd_provider_fax" data-label="Fax"></div>
                    <div id="rnd-specdescr" data-bind="rnd_specdescr" data-label="Specialty"></div>
                    <div id="rnd-npino" data-bind="rnd_NPINO" data-label="NPI"></div>
                </div>
            </fieldset>
        </div>
        <div id="vnd">
            <fieldset>
                <legend>Vendor</legend>
                <div class="artifact-sub-section">
                    <div id="vendornm" data-bind="VENDORNM" data-label="Name"></div>
                    <div id="vendorid" data-bind="VENDORID" data-label="Vendor ID"></div>
                    <div id="vendor-address" data-bind="vendor_address" data-label="Address"></div>
                    <div id="vendor-phone" data-bind="vendor_phone" data-label="Phone"></div>
                    <div id="vendor-fax" data-bind="vendor_fax" data-label="Fax"></div>
                    <div id="vendor-tax-id" data-bind="vendor_tax_id" data-label="Tax ID"></div>
                    <div id="vendor-npi" data-bind="VENDOR_NPI" data-label="NPI"></div>
                </div>
            </fieldset>
        </div>
        <div id="cps">
            <fieldset>
                <legend>Claim Process Status</legend>
                <div id="cps-div"></div>
            </fieldset>
        </div>
        <div id="nte">
            <fieldset>
                <legend>Notes</legend>
                <div id="nte-div"></div>
            </fieldset>
        </div>
        <div id="oth">
            <fieldset>
                <legend>Referenced in Notes</legend>
                <div id="oth-div"></div>
            </fieldset>
        </div>
        <div id="inc">
            <fieldset>
                <legend>Incidents</legend>
                <div id="inc-div"></div>
            </fieldset>
        </div>
        <div id="dup">
            <fieldset>
                <legend>Duplicates</legend>
                <div id="dup-div"></div>
            </fieldset>
        </div>
    </div>
</div>
