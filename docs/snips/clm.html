<div id="adiv" style="display: block">
  <div id="art" class="scp-section">

        <div class="artifact-section">

            <div id="authno"></div>

          <div>

          <div>
            <div id="provclaim"></div>
            <div id="datepaid"></div>

          <div>

    <div id="pcp">

    <div id="inc">

    </div>
