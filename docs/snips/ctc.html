<div id="ctc" class="content-container" data-section="contact">
    <h2>Contact</h2>
    <div class="sng btn-bar">
        <input id="ct-ic" name="contact.category" type="radio" value="IC" /><label for="ct-ic">Incoming</label><input id="ct-oc" name="contact.category" type="radio" value="OC" /><label for="ct-oc">Outgoing</label><input id="ct-f" name="contact.category" type="radio" value="F" /><label for="ct-f">Fax</label><input id="ct-id" name="contact.category" type="radio" value="ID" /><label for="ct-id">Internal</label><input id="ct-ot" name="contact.category" type="radio" value="OT" /><label for="ct-ot"
            >Other</label
        ><input id="ct-l" name="contact.category" type="radio" value="L" /><label for="ct-l">Letter</label><input id="ct-e" name="contact.category" type="radio" value="E" /><label for="ct-e">Email</label><input id="ct-mi" name="contact.category" type="radio" value="MI" /><label for="ct-mi">Member</label><input id="ct-hp" name="contact.category" type="radio" value="HP" /><label for="ct-hp">Health Plan</label>
    </div>
    <div class="trp dnd" data-group="contact-search"><input id="ctc-fn" class="inp" name="contact.firstName" placeholder="First Name" data-format="change-case-word" /><label class="lbl" for="ctc-fn">First Name</label></div>
    <div class="trp dnd" data-group="contact-search"><input id="ctc-ln" class="inp" name="contact.lastName" placeholder="Last Name" data-format="change-case-word" /><label class="lbl" for="ctc-ln">Last Name</label></div>
    <div class="trp dnd" data-group="contact-search"><input id="ctc-rl" class="inp" name="contact.relationship" placeholder="Relationship" /><button id="relation-btn" class="sbn" type="button" tabindex="-1">…</button><label class="lbl" for="ctc-rl">Relationship</label></div>
    <div class="trp dnd" data-group="contact-search"><input id="ctc-ph" class="inp" name="contact.phone" placeholder="Phone Number" data-format="tel|e" /><label class="lbl" for="ctc-ph">Phone Number</label></div>
    <div class="trp dnd" data-group="contact-search"><input id="ctc-fx" class="inp" name="contact.fax" placeholder="Fax Number" data-format="tel" /><label class="lbl" for="ctc-fx">Fax Number</label></div>
    <div class="trp dnd" data-group="contact-search"><input id="ctc-em" class="inp" name="contact.email" placeholder="Email Address" data-format="change-case-lower" /><label class="lbl" for="ctc-em">Email Address</label></div>
    <div class="sng dnd" data-group="contact-search"><textarea id="ctc-note" class="inp txt" name="contact.reason" placeholder="Reason"></textarea><label class="lbl" for="ctc-note">Reason</label></div>
</div>
