<div id="adiv" style="display: block">
  <div id="art-body" class="scp-section">
    <div id="hdr">
      <div class="button-container">
        <input id="clear-artifact" class="lbn" type="button" value="Clear" />
      </div>
    </div>
    <div id="csi">
      <fieldset>
        <legend>Incident</legend>
        <div class="artifact-section">
          <div>
            <div id="incident-number"></div>
            <div id="contact-category"></div>
          </div>
          <div>
            <div id="incident-open-date"></div>
            <div id="incident-close-date"></div>
          </div>
        </div>
      </fieldset>
    </div>
    <div id="ctc">
      <fieldset>
        <legend>Contact</legend>
        <div class="artifact-section">
          <div>
            <div id="incident-ctc-first-name"></div>
            <div id="incident-ctc-last-name"></div>
            <div id="incident-ctc-relation"></div>
          </div>
          <div>
            <div id="incident-ctc-phone"></div>
            <div id="incident-ctc-fax"></div>
            <div id="incident-ctc-email"></div>
          </div>
        </div>
      </fieldset>
    </div>
    <div id="cst">
      <fieldset>
        <legend>Customer</legend>
        <div class="artifact-section">
          <div id="customer-category"></div>
          <div id="incident-cust-id"></div>
          <div id="incident-cust-name"></div>
        </div>
        <div class="artifact-section">
          <div id="incident-cust-birthdate"></div>
          <div id="incident-cust-sex"></div>
        </div>
        <div class="artifact-section">
          <div id="incident-cust-language"></div>
        </div>
        <div class="artifact-section">
          <div id="incident-cust-address"></div>
          <div id="incident-cust-tax-id"></div>
          <div id="incident-cust-npi"></div>
        </div>
        <div class="artifact-section">
          <div id="incident-cust-note"></div>
        </div>
      </fieldset>
    </div>
    <div id="rfr">
      <fieldset>
        <legend>Reference</legend>
        <div class="artifact-section">
          <div id="reference-category"></div>
          <div id="incident-ref-id"></div>
          <div id="incident-ref-name"></div>
        </div>
        <div class="artifact-section">
          <div id="incident-ref-birthdate"></div>
          <div id="incident-ref-sex"></div>
        </div>
        <div class="artifact-section">
          <div id="incident-ref-language"></div>
        </div>
        <div class="artifact-section">
          <div id="incident-ref-address"></div>
          <div id="incident-ref-tax-id"></div>
          <div id="incident-ref-npi"></div>
        </div>
        <div class="artifact-section">
          <div id="incident-ref-type"></div>
          <div id="incident-ref-sub-type"></div>
        </div>
        <div class="artifact-section">
          <div id="incident-ref-artifact-type"></div>
          <div id="incident-ref-artifact-id"></div>
        </div>
        <div class="artifact-section">
          <div id="incident-ref-note"></div>
        </div>
      </fieldset>
    </div>
    <div id="res">
      <fieldset>
        <legend>Resolution</legend>
        <div class="artifact-section">
          <div id="incident-res-priority"></div>
          <div id="incident-res-status"></div>
          <div id="incident-res-action"></div>
        </div>
        <div class="artifact-section">
          <div id="incident-res-result"></div>
          <div id="incident-res-assign"></div>
        </div>
      </fieldset>
    </div>
    <div id="nte">
      <fieldset>
        <legend>Incident Actions</legend>
        <div id="nte-div"></div>
      </fieldset>
    </div>
  </div>
</div>
