<h2>Stethoscope Login</h2>
<div class="brk"></div>
<form id="loginForm">
    <div class="sng"><input id="app-user" class="inp" type="text" placeholder="User Name" autocomplete="off" /><label class="lbl" for="app-user">User Name</label></div>
    <div class="sng"><input id="app-pass" class="inp" type="password" placeholder="Password" autocomplete="off" /><label class="lbl" for="app-user">Password</label></div>
    <div id="error-message" class="error-message"></div>
    <div class="button-container"><button id="login-btn" class="lbn" type="button">Login</button><button id="cancel-login-btn" class="lbn" type="button">Cancel</button></div>
</form>
