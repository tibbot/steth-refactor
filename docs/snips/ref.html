<div id="ref" class="content-container" data-section="reference">
    <h2>Reference</h2>
    <div class="sng btn-bar">
        <input id="rc-mbr" name="reference.category" type="radio" value="MEMBER" /><label for="rc-mbr">Member</label><input id="rc-prv" name="reference.category" type="radio" value="PROVIDER" /><label for="rc-prv">Provider</label><input id="rc-vnd" name="reference.category" type="radio" value="VENDOR" /><label for="rc-vnd">Vendor</label><input id="rc-oth" name="reference.category" type="radio" value="OTHER" /><label for="rc-oth">Other</label
        ><input id="rc-cpy" name="reference.category" type="radio" value="SAME" /><label for="rc-cpy">Same</label>
    </div>
    <div id="reference-search-container" class="trp dnd" data-group="reference-search"><input id="reference-id" class="inp" name="reference.id" placeholder="Reference" data-format="change-case" /><button id="reference-search" class="sbn ibn" type="button" tabindex="-1">…</button><label id="reference-id-label" class="lbl" for="reference-id">Reference</label></div>
    <div class="brk dnd" data-group="reference-search"></div>
    <div class="trp dnd" data-group="reference-search"><input id="ref-type-abbr" class="inp" name="reference.subtypeCode" placeholder="Subtype" data-format="change-case" /><label class="lbl" for="ref-type-abbr">Subtype Code</label></div>
    <div class="trp dnd" data-group="reference-search">
        <select id="ref-type" class="inp" name="reference.type">
            <option value="G">Guy</option></select
        ><label class="lbl" for="ref-type">Type</label>
    </div>
    <div class="trp dnd" data-group="reference-search">
        <select id="ref-sub-type" class="inp" name="reference.subtype">
            <option value=""></option></select
        ><label class="lbl" for="ref-sub-type">Subtype</label>
    </div>
    <div class="sng dnd"><textarea id="ref-note" class="inp txt" name="reference.note" placeholder="Reference Note"></textarea><label class="lbl" for="ref-note">Customer Note</label></div>
    <div class="clct dnd"></div>
    <div class="detl dnd">
        <div class="detl__hdr"><span class="detl__icon"></span></div>
        <div class="detl__data"></div>
    </div>
</div>
