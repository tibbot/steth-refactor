<div id="res" class="content-container" data-section="resolution">
    <h2>Resolution</h2>
    <div class="brk"></div>
    <div class="trp"><input id="res-priority" class="inp" name="resolution.priority" placeholder="Priority" data-oneof="dataLibrary.arrPriority" data-format="change-case" /><button id="priority-btn" class="sbn" type="button" tabindex="-1">…</button><label class="lbl" for="res-priority">Priority</label></div>
    <div class="trp"><input id="res-status" class="inp" name="resolution.status" placeholder="Status" data-oneof="dataLibrary.arrStatus" data-format="change-case" /><button id="status-btn" class="sbn" type="button" tabindex="-1">…</button><label class="lbl" for="res-status">Status</label></div>
    <div class="trp"><input id="res-result" class="inp" name="resolution.result" placeholder="Result" data-oneof="dataLibrary.arrResult" data-format="change-case" /><button id="result-btn" class="sbn" type="button" tabindex="-1">…</button><label class="lbl" for="res-result">Result</label></div>
    <div class="trp"><input id="res-action-code" class="inp" name="resolution.actionCode" placeholder="Action Code" data-oneof="dataLibrary.arrAction" data-format="change-case" /><button id="action-btn" class="sbn" type="button" tabindex="-1">…</button><label class="lbl" for="res-action-code">Action Code</label></div>
    <div class="trp"><input id="res-assign" class="inp" name="resolution.responsiblePerson" placeholder="Assigned To" data-format="change-case" /><button id="respper-btn" class="sbn" type="button" tabindex="-1">…</button><label class="lbl" for="res-assign">Assigned To</label></div>
    <div class="sng"><textarea id="res-note" class="inp txt" name="resolution.note" placeholder="Action Note"></textarea><label class="lbl" for="res-note">Action Note</label></div>
</div>
